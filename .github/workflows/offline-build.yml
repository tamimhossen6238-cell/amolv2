
name: Build Offline APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          # এক লাইনে সব প্রয়োজনীয় প্যাকেজ ইনস্টল করা হচ্ছে
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # প্যাকেজ ফাইল তৈরি
          echo '{"name": "amol-app", "version": "1.0.0"}' > package.json
          
          # ক্যাপাসিটর শুরু এবং অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ
          npx cap init "AmolApp" "com.amol.offline" --web-dir .
          npx cap add android
          
          # আপনার ফাইলগুলো অ্যান্ড্রয়েড ফোল্ডারে কপি করা
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

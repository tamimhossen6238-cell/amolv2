name: Build Offline APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Files and Build
        run: |
          # ১. একটি ফোল্ডার তৈরি করে সব ফাইল সেখানে সরানো (WebDir ইস্যু সমাধানের জন্য)
          mkdir -p www
          cp -r * www/ || true
          rm -rf www/.github www/www # অপ্রয়োজনীয় ফাইল সরানো
          
          # ২. প্রয়োজনীয় টুল ইনস্টল
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # ৩. প্যাকেজ ফাইল তৈরি
          echo '{"name": "amol-app", "version": "1.0.0"}' > package.json
          
          # ৪. ক্যাপাসিটর শুরু (এবার ফোল্ডার হিসেবে 'www' দেওয়া হয়েছে)
          npx cap init "AmolApp" "com.amol.offline" --web-dir www
          npx cap add android
          
          # ৫. কোড কপি করা
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk


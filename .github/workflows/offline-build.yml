name: Build Offline APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Offline Project
        run: |
          # কোনো কনফিগারেশন ছাড়াই সরাসরি অ্যান্ড্রয়েড প্রজেক্ট তৈরি
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          # একটি ডামি প্যাকেজ ফাইল তৈরি যাতে এরর না আসে
          echo '{"name": "amol-app", "version": "1.0.0"}' > package.json
          npx cap init "AmolApp" "com.amol.offline" --web-dir .
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

